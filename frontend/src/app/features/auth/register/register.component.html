<section class="register-screen">
  <mat-card class="register-card">
    <div class="register-copy">
      <div class="hero-brand"><span class="brand-skill">Skill</span><span class="brand-sync">Sync</span></div>
      <h1>Create your account</h1>
      <span>
        Join as a learner or mentor. Mentor onboarding and availability details get filled in after sign-up.
      </span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <mat-form-field appearance="outline">
        <mat-label>Full name</mat-label>
        <input matInput formControlName="name" placeholder="Aarav Sharma">
        <mat-icon matPrefix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="aarav@example.com">
        <mat-icon matPrefix>alternate_email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" placeholder="Minimum 6 characters">
        <mat-icon matPrefix>key</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Primary role</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let role of roles" [value]="role.value">{{ role.label }}</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-flat-button class="btn-primary-pill submit-button" type="submit" [disabled]="registerForm.invalid || isSubmitting">
        <mat-icon>{{ isSubmitting ? 'hourglass_top' : 'how_to_reg' }}</mat-icon>
        {{ isSubmitting ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="switch-copy">
      Already registered?
      <a routerLink="/auth/login">Sign in</a>
    </p>
  </mat-card>
</section>
