server:
  port: 8888

spring:
  profiles:
    active: native
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          enabled: false # FORCE DISABLE GIT
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:///app/config-repo/}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
