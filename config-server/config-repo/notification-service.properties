spring.application.name=notification-service
server.port=8089
spring.datasource.url=${DB_NOTIF_URL:jdbc:postgresql://localhost:5432/skillsync_notification}
spring.datasource.username=${DB_NOTIF_USER:postgres}
spring.datasource.password=${DB_NOTIF_PW:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
springdoc.api-docs.path=/notifications/v3/api-docs
springdoc.api-docs.enabled=true

server.forward-headers-strategy=FRAMEWORK
springdoc.api-docs.servers[0].url=http://localhost:8080
springdoc.api-docs.servers[0].description=API Gateway
