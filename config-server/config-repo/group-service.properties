spring.application.name=group-service
server.port=8087
spring.datasource.url=${DB_GROUP_URL:jdbc:postgresql://localhost:5432/skillsync_group}
spring.datasource.username=${DB_GROUP_USER:postgres}
spring.datasource.password=${DB_GROUP_PW:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
springdoc.api-docs.path=/groups/v3/api-docs
springdoc.api-docs.enabled=true

server.forward-headers-strategy=FRAMEWORK
springdoc.api-docs.servers[0].url=http://localhost:8080
springdoc.api-docs.servers[0].description=API Gateway
